# ==============================================================================
# Render Infrastructure Blueprint (render.yaml)
# Deploys both FastAPI Backend Web Service and React Frontend Static Site on Render
# ==============================================================================

services:
  # ── 1. FastAPI Backend Web Service ──────────────────────────────────────────
  - type: web
    name: intelliproject-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false  # Paste your Neon PostgreSQL connection string here in the Render dashboard
      - key: GROQ_API_KEY
        sync: false  # Paste your Groq API key here in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render will automatically generate a secure random 256-bit secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.onrender.com,*"

  # ── 2. React Vite Frontend Static Site ──────────────────────────────────────
  - type: web
    name: intelliproject-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Crucial for Single Page Applications (React Router) to handle client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Set to: https://intelliproject-backend.onrender.com/api/v1 (replace with your actual backend URL)
